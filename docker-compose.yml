services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rca
      POSTGRES_PASSWORD: rca_dev_password
      POSTGRES_DB: rca_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://rca:rca_dev_password@db:5432/rca_copilot
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: